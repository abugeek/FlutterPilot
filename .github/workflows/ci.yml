name: CI

on:
  push:
    branches: [main]
  # Every PR, including ones stacked on another PR's branch.
  pull_request:
  # Weekly: catches a new major of a host package (go_router, flutter_bloc,
  # ...) that a plugin's version range would reject, even without pushes.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Format Check
        run: melos run format

      - name: Analyze
        run: melos run analyze

      - name: Test All Packages
        run: melos run test

      - name: Plugin ranges accept the latest host packages
        run: dart run tool/check_plugin_ranges.dart

  # The real gate: fresh app -> `flutterpilot init --local` -> flutter run ->
  # MCP server over stdio. See packages/flutterpilot_server/tool/e2e_test.dart.
  e2e-apple-web:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [macos, ios, web]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Pick device
        run: |
          case "${{ matrix.target }}" in
            macos) echo "DEVICE=macos" >> "$GITHUB_ENV" ;;
            web) echo "DEVICE=chrome" >> "$GITHUB_ENV" ;;
            ios)
              UDID=$(xcrun simctl list devices available -j \
                | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
              xcrun simctl boot "$UDID"
              echo "DEVICE=$UDID" >> "$GITHUB_ENV" ;;
          esac

      # Hosted iOS simulators are slow enough to occasionally drop the VM
      # service connection; retry once and leave a visible warning.
      - name: End-to-end test
        working-directory: packages/flutterpilot_server
        run: |
          dart run tool/e2e_test.dart -d "$DEVICE" && exit 0
          [ "${{ matrix.target }}" = ios ] || exit 1
          echo "::warning::iOS e2e failed once on this runner; retrying"
          dart run tool/e2e_test.dart -d "$DEVICE"

      # Same path for an app without flutterpilot_sdk (zero-code mode).
      - name: End-to-end test (zero-code)
        if: matrix.target != 'ios'
        working-directory: packages/flutterpilot_server
        run: dart run tool/e2e_test.dart --zero-code -d "$DEVICE"

  e2e-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: End-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          # The default (-gpu swiftshader_indirect) renders on the host,
          # whose GPU layer crashed the whole emulator mid-run ("Failed to
          # find ColorBuffer", then adb lost it); guest renders inside it.
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim
          # Retries once while the emulator lives; on failure prints why.
          script: cd packages/flutterpilot_server && sh tool/ci_android_e2e.sh
