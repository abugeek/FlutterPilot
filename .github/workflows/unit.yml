name: Unit

# The quick gate: formatting, analysis and every package's unit tests on
# Linux, plus the server's whole suite and the CLI on Windows. Minutes, no
# simulators. The device runs (macOS, iOS, Android, web end-to-end) are the
# CI workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Format Check
        run: melos run format

      - name: Analyze
        run: melos run analyze

      - name: Test All Packages
        run: melos run test

      - name: Plugin ranges accept the latest host packages
        run: dart run tool/check_plugin_ranges.dart

  # The full server suite and the CLI on Windows. Several tests take a
  # different path there — launch_app's supervisor and liveness check
  # (tasklist), the call log, path and command-line normalisation, and the
  # CLI's doctor — so they only ever run here (task 20).
  windows-process-code:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Server tests on Windows
        working-directory: packages/flutterpilot_server
        run: |
          dart pub get
          dart test

      - name: CLI
        working-directory: packages/flutterpilot_cli
        run: |
          dart pub get
          dart test
