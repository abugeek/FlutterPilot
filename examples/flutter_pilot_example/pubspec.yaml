name: flutter_pilot_example
description: "A small todo app wired for FlutterPilot: Dio, Riverpod, go_router and shared_preferences."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5

  flutterpilot_sdk:
    path: ../../packages/flutterpilot_sdk
  flutterpilot_dio:
    path: ../../packages/plugins/flutterpilot_dio
  flutterpilot_gorouter:
    path: ../../packages/plugins/flutterpilot_gorouter
  flutterpilot_riverpod:
    path: ../../packages/plugins/flutterpilot_riverpod
  flutterpilot_shared_preferences:
    path: ../../packages/plugins/flutterpilot_shared_preferences

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# The plugins depend on flutterpilot_sdk from pub.dev; use this checkout's.
dependency_overrides:
  flutterpilot_sdk:
    path: ../../packages/flutterpilot_sdk
