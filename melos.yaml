name: flutter_pilot

packages:
  - packages/**
  - examples/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: dart run melos exec -c 1 -- "dart analyze"
    description: Run static analysis for all packages.

  format:
    run: dart run melos exec -c 1 -- "dart format --set-exit-if-changed ."
    description: Run dart format for all packages.

  test:
    run: dart tool/package_test_runner.dart
    description: Run every package's tests through the fail-closed aggregate runner.

  server:run:
    run: dart run packages/fp_server/bin/fp_server.dart
    description: Run the FlutterPilot MCP Server.

  example:run:
    run: cd examples/flutter_pilot_example && flutter run
    description: Run the example reference app.

  fix:
    run: melos exec -c 1 -- "flutter fix --apply || dart fix --apply"
    description: Apply automated fixes to all packages.
