name: fp_server
description: "MCP server bridge for FlutterPilot — connects AI agents to Flutter app runtime."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - mcp
  - ai
  - debugging
  - devtools

environment:
  sdk: ^3.11.0

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  image: ^4.5.0
  logging: ^1.3.0
  mcp_dart: ^2.4.0
  path: ^1.9.0
  vm_service: ^15.1.0

dev_dependencies:
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.25.6
  # tool/eval reads its task list from tasks.yaml and hashes fixtures with
  # sha256. Both are already transitive dependencies; declared so importing
  # them directly is not a lint.
  yaml: ^3.1.3
  crypto: ^3.0.6
