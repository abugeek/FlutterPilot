name: fp_server
description: "MCP server bridge for FlutterPilot — connects AI agents to Flutter app runtime."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - mcp
  - ai
  - debugging
  - devtools

environment:
  sdk: ^3.11.0

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  image: ^4.5.0
  logging: ^1.3.0
  mcp_dart: ^2.4.0
  # Already transitive via mcp_dart; declared so importing it for
  # `@visibleForTesting` (the startup-connect seam) is not a lint.
  meta: ^1.19.0
  path: ^1.9.0
  vm_service: ^15.1.0

dev_dependencies:
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.25.6
  # Used by tool/benchmarks/startup_benchmark.dart.
  crypto: ^3.0.6
