name: fp_firebase
description: "FlutterPilot plugin for Firebase Auth and Cloud Firestore to inspect the signed-in user and read app-accessible documents."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - firebase
  - mcp
  - firebase-auth
  - cloud-firestore

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=3.0.0 <6.0.0"
  firebase_auth: ">=5.0.0 <8.0.0"
  cloud_firestore: ">=5.0.0 <8.0.0"
  fp_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
