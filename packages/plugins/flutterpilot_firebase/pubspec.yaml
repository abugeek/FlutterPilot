name: flutterpilot_firebase
description: "Firebase inspector plugin for FlutterPilot — exposes Crashlytics logs, analytics events, performance traces, and FCM status to AI agents."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - firebase
  - mcp
  - ai
  - debugging

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=2.0.0"
  firebase_crashlytics: ">=3.0.0"
  firebase_analytics: ">=10.0.0"
  firebase_performance: ">=0.9.0"
  firebase_messaging: ">=14.0.0"
  flutterpilot_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
