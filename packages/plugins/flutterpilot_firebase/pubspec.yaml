name: flutterpilot_firebase
description: "Firebase inspector plugin for FlutterPilot — lets AI agents see Firebase Auth state and read Firestore the way the app does."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - firebase
  - mcp
  - ai
  - debugging

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=3.0.0 <5.0.0"
  firebase_auth: ">=5.0.0 <7.0.0"
  cloud_firestore: ">=5.0.0 <7.0.0"
  flutterpilot_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
