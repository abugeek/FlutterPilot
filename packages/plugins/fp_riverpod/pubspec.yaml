name: fp_riverpod
description: "FlutterPilot plugin for Riverpod to inspect providers and set in-memory provider state during Flutter app testing."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - riverpod
  - mcp
  - state-management
  - debugging

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  riverpod: ">=3.0.0 <4.0.0"
  fp_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
