name: fp_drift
description: "FlutterPilot plugin for Drift to inspect SQLite databases and query app data during Flutter development and testing."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - drift
  - mcp
  - sqlite
  - database

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  drift: ">=2.0.0 <3.0.0"
  fp_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
