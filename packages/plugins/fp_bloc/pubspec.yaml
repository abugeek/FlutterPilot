name: fp_bloc
description: "FlutterPilot plugin for Bloc and Cubit to inspect and update app state from an AI agent during Flutter development and testing."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - bloc
  - mcp
  - state-management
  - debugging

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ">=8.1.5 <10.0.0"
  fp_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
