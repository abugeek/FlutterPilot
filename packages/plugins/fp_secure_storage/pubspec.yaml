name: fp_secure_storage
description: "FlutterPilot plugin for flutter_secure_storage to inspect stored keys with redaction and manage values during Flutter testing."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - security
  - mcp
  - storage
  - debugging

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  fp_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
