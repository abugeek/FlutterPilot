name: fp_supabase
description: "FlutterPilot plugin for supabase_flutter to inspect auth sessions and query data using the app's Supabase client and row-level security."
version: 0.1.0
homepage: https://github.com/abugeek/FlutterPilot
repository: https://github.com/abugeek/FlutterPilot
issue_tracker: https://github.com/abugeek/FlutterPilot/issues
topics:
  - flutter
  - supabase
  - mcp
  - database
  - authentication

environment:
  sdk: ^3.11.0
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ">=2.0.0 <3.0.0"
  fp_sdk: ^0.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
